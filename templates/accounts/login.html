{% extends "includes/base.html" %}

{% block content %}

<div class="min-h-screen flex items-center justify-center bg-gray-50">

    <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg">

        <h2 class="text-3xl font-bold text-center text-gray-800 mb-8">
            Login to Your Account
        </h2>
        {% if messages %}
        {% for message in messages %}
        <div class="mb-4 p-3 rounded-lg text-sm 
            {% if message.tags == 'error' %}bg-red-100 text-red-700
            {% elif message.tags == 'success' %}bg-green-100 text-green-700
            {% else %}bg-gray-100 text-gray-700{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        <form method="post" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">
                    Username
                </label>
                <input type="text" name="username" class="w-full border border-gray-300 rounded-lg px-4 py-2
                              focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">
                    Password
                </label>
                <input type="password" name="password" class="w-full border border-gray-300 rounded-lg px-4 py-2
                              focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg
                           hover:bg-blue-700 transition duration-200">
                Login
            </button>
        </form>

        <p class="text-sm text-center text-gray-500 mt-6">
            Don’t have an account?
            <a href="{% url 'register' %}" class="text-blue-600 hover:underline">
                Register
            </a>
        </p>

    </div>

</div>

{% endblock %}
