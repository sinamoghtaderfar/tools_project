{% extends "base.html" %}
{% load static %}

{% block content %}

<script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>

<div class="min-h-screen bg-gray-100 p-6 flex flex-col items-center">

    <h1 class="text-4xl font-extrabold mb-8 text-gray-800">🐍 Python Online Editor</h1>

    <div class="w-full max-w-4xl bg-white rounded-xl shadow-lg p-6 flex flex-col space-y-4">

        <textarea id="code" class="w-full h-64 p-4 rounded-xl bg-gray-800 text-white border border-gray-700 font-mono">
print("Hello 👋")
</textarea>

        <div class="flex gap-3 mt-4">

            <button onclick="runCode()" class="px-6 py-2 bg-green-600 text-white rounded-xl hover:bg-green-700">
                Run
            </button>

            <button onclick="clearOutput()" class="px-6 py-2 bg-red-600 text-white rounded-xl hover:bg-red-700">
                Clear
            </button>

        </div>

        <div class="mt-6">
            <h2 class="text-xl mb-2 text-gray-800">Output</h2>
            <pre id="output" class="bg-black text-green-400 p-4 rounded-xl min-h-[120px]"></pre>
        </div>

    </div>
</div>

<script>

    let pyodideReady = false
    let pyodide

    async function loadPyodideAndPackages() {
        pyodide = await loadPyodide()
        pyodideReady = true
    }

    loadPyodideAndPackages()

    async function runCode() {

        if (!pyodideReady) {
            document.getElementById("output").textContent = "Python is loading..."
            return
        }

        const code = document.getElementById("code").value

        try {

            pyodide.runPython(`
import sys
from io import StringIO
sys.stdout = StringIO()
`)

            pyodide.runPython(code)

            const output = pyodide.runPython("sys.stdout.getvalue()")

            document.getElementById("output").textContent = output

        } catch (err) {
            document.getElementById("output").textContent = err
        }

    }

    function clearOutput() {
        document.getElementById("output").textContent = ""
    }

</script>

{% endblock %}
