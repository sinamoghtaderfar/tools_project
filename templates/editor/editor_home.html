{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="min-h-screen bg-gray-100 p-6 flex flex-col items-center">

    <!-- عنوان -->
    <h1 class="text-4xl font-extrabold mb-8 text-gray-800">🐍 Python Online Editor</h1>

    <!-- کادر ادیتور -->
    <div class="w-full max-w-4xl bg-white rounded-xl shadow-lg p-6 flex flex-col space-y-4">

        <!-- Editor -->
        <label for="code-editor" class="text-gray-700 font-semibold">Your Code:</label>
        <textarea id="code-editor" 
                  class="w-full h-64 p-4 border border-gray-300 rounded-lg bg-gray-50 font-mono text-gray-900 resize-none focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400"
                  placeholder="Write your Python code here..."></textarea>

        <!-- Run Button -->
        <button id="run-btn" 
                class="self-start px-6 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition shadow-md hover:shadow-lg">
            Run 🏃‍♂️
        </button>

        <!-- Output -->
        <label for="output" class="text-gray-700 font-semibold">Output:</label>
        <div id="output" 
             class="w-full h-40 p-4 border border-gray-300 rounded-lg bg-gray-50 font-mono text-gray-800 whitespace-pre-wrap overflow-y-auto shadow-inner">
            Output will appear here...
        </div>
    </div>
</div>

{% endblock %}
