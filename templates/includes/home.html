{% extends "base.html" %}
{% load static %}
{% block content %}

<!-- ================= HERO SECTION ================= -->
<section class="text-center py-16">
    <h1 class="text-5xl font-extrabold text-gray-800 mb-6">
        Powerful Online Tools
    </h1>

    <p class="text-lg text-gray-600 mb-8 max-w-2xl mx-auto">
        Manage your PDFs, Images, and Documents easily with our fast, secure and completely free online tools.
    </p>

    <!-- Search Bar -->
    <div class="max-w-xl mx-auto relative mb-10">
        <input type="text" id="toolSearch" placeholder="Search for a tool..."
            class="w-full px-6 py-3 rounded-full border shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">

        <div id="searchResults" class="absolute left-0 right-0 mt-2 bg-white border rounded-lg shadow-lg z-50 hidden"></div>
    </div>

    <!-- Tools Data -->
    <script>
        const allTools = [
            { "name": "Merge PDF", "url": "{% url 'tool_page' 'merge-pdf' %}" },
            { "name": "Compress Image", "url": "{% url 'tool_page' 'compress-image' %}" },
            { "name": "Convert PDF", "url": "{% url 'tool_page' 'convert-pdf' %}" }
        ];
    </script>
</section>

<!-- ================= TOOLS SECTION ================= -->
<section class="py-12">
    <h2 class="text-3xl font-bold text-center mb-10 text-gray-800">
        Popular Tools
    </h2>

    <div class="grid md:grid-cols-3 gap-8" id="toolsGrid">
        <!-- Tool cards will be inserted by JS -->
    </div>
</section>
<!-- ================= CTA / EXPLORE ALL TOOLS ================= -->
<section class="text-center py-16">
    <h2 class="text-3xl font-bold text-gray-800 mb-6">
        Ready to Get Started?
    </h2>

    <a href="{% url 'tools_list' %}" class="bg-blue-600 text-white px-8 py-3 rounded-full
              hover:bg-blue-700 transition shadow-lg">
        Explore All Tools
    </a>
</section>

{% endblock %}
