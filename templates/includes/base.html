<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ToolsHub - Your Ultimate Tools Platform{% endblock %}</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Optional: Add custom fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>

    {% block extra_css %}{% endblock %}
    {% load static %}

</head>

<body class="bg-gray-50 min-h-screen flex flex-col overflow-x-hidden">

    <!-- Include Navbar -->
    {% include 'includes/navbar.html' %}

    <!-- Main Content Area -->
    <main class="flex-grow">
        {% block content %}
        <!-- Page specific content will go here -->
        {% endblock %}
    </main>

    <!-- Include Footer -->
    {% include 'includes/footer.html' %}

    {% block extra_js %}{% endblock %}

    <!-- {% include "includes/logout_modal.html" %} -->

    {% include "includes/logout_modal.html" %}

    {% if user.is_authenticated %}
    <script src="{% static 'js/auto-logout.js' %}"></script>
    {% endif %}
</body>

</html>
