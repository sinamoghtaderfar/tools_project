<div id="logoutModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">

    <div class="bg-white p-6 rounded-xl shadow-lg text-center w-96">

        <h2 class="text-xl font-bold mb-4">
            Session Expiring
        </h2>

        <p class="mb-6">
            Your session is about to expire. Do you want to stay logged in?
        </p>
        <p class="mb-4">
            You will be logged out in
            <span id="countdown">30</span>
            seconds
        </p>
        <div class="flex justify-center gap-4">

            <button id="stayLoggedIn" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                Stay Logged In
            </button>

            <button id="logoutNow" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700">
                Logout
            </button>

        </div>
    </div>
</div>
